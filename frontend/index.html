<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BayGrid — Smart Parking Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    window.react = window.React;
  </script>
  <script src="https://unpkg.com/framer-motion@10.16.16/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #ffffff;
      color: #09090b;
      overflow-x: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Liquid Glass Floating Pill Nav (inspired by MovieGo+) */
    .glass-nav-dark {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        0 18px 45px rgba(0, 0, 0, 0.28);
    }

    .glass-nav-light {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 14px 36px rgba(15, 23, 42, 0.08);
    }

    /* Subtle frosted card surface for overlays */
    .glass-overlay-pill {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    /* Architectural 3D perspective & subtle motion */
    .perspective-stage {
      perspective: 1050px;
    }

    .tilt-card-3d {
      transform-style: preserve-3d;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
      will-change: transform;
    }

    @keyframes heroDrift {
      0%, 100% {
        transform: scale(1.02) translate3d(0px, 0px, 0px);
      }
      50% {
        transform: scale(1.07) translate3d(-0.8%, -0.5%, 0px);
      }
    }

    .animate-hero-drift {
      animation: heroDrift 18s ease-in-out infinite;
    }

    @keyframes subtleSpin3D {
      0% {
        transform: rotateX(12deg) rotateY(-18deg) translateY(0px);
      }
      50% {
        transform: rotateX(8deg) rotateY(18deg) translateY(-4px);
      }
      100% {
        transform: rotateX(12deg) rotateY(-18deg) translateY(0px);
      }
    }

    .animate-spin-3d {
      animation: subtleSpin3D 5s ease-in-out infinite;
      transform-style: preserve-3d;
    }

    /* Clean monochrome scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f4f4f5;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4d4d8;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a1a1aa;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-black antialiased selection:bg-black selection:text-white">
  <div id="root"></div>
  <script type="text/babel" src="/src/App.jsx"></script>
</body>
</html>
